name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update package registry index
        run: moon update
      - name: Check (zero warnings enforced)
        run: moon check --deny-warn
      - name: Test
        run: moon test
      - name: Build CLI (native)
        run: moon build --target native cmd/yj
