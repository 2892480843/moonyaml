# A realistic Kubernetes-style manifest exercising most YAML features.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - 80
            - 443
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: FEATURES
              value: "gzip, cache"
          resources:
            limits: {cpu: 0.5, memory: "128Mi"}
